# This workflow runs whenever a PR is opened or updated, or a commit is pushed to main. It runs
# several checks:
# - fmt: checks that the code is formatted according to rustfmt
# - clippy: checks that the code does not contain any clippy warnings
# - check: checks that the code is compileable across platforms
# - doc: checks that the code can be documented without errors
# - hack: check combinations of feature flags
# - msrv: check that the msrv specified in the crate is correct
# - flake: checks the flake.nix file
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: check
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: fmt
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    name: clippy
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: cargo clippy
        uses: giraffate/clippy-action@v1
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        with:
          reporter: "github-pr-check"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: check / ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            target: x86_64-unknown-linux-gnu
          - platform: windows
            target: x86_64-pc-windows-gnu
          - platform: macos
            target: x86_64-apple-darwin
          # - platform: android
          #   target: aarch64-linux-android

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: cargo install cargo-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cross

      ## caching the cross files is as slow as letting it download
      ##
      # - name: Set cross compiler directory
      #   run: echo "CROSS_COMPILER_DIR=$HOME/.cargo/cross" >> "$GITHUB_ENV"
      #
      # - name: Cache cargo-cross
      #   uses: actions/cache@v6
      #   with:
      #     path: ~/.cargo/cross
      #     key: cargo-cross-${{ runner.os }}-${{ matrix.target }}

      - name: Setup cross environment
        run: |
          cargo cross setup \
            --target "${{ matrix.target }}" \
            --format bash >> "$GITHUB_ENV"

      - name: Cargo check
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          cargo check \
            --target "${{ matrix.target }}" \
            --all-features

  version-gate:
    runs-on: ubuntu-latest
    name: version-gate
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare against latest GitHub release
        id: check
        run: bash .github/scripts/version_check.sh

  semver:
    runs-on: ubuntu-latest
    name: semver
    needs: version-gate
    if: needs.version-gate.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
  doc:
    # run docs generation on nightly rather than stable. This enables features like
    # https://doc.rust-lang.org/beta/unstable-book/language-features/doc-cfg.html which allows an
    # API be documented as only available in some specific platforms.
    runs-on: ubuntu-latest
    name: doc / nightly
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-docs-rs
        uses: dtolnay/install@cargo-docs-rs

      - name: cargo docs-rs
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo docs-rs

  # hack:
  #   # cargo-hack checks combinations of feature flags to ensure that features are all additive
  #   # which is required for feature unification
  #   runs-on: ubuntu-latest
  #   name: feature combinations
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     - name: Install stable
  #       uses: dtolnay/rust-toolchain@master
  #       with:
  #         toolchain: stable
  #
  #     - name: Setup sccache
  #       uses: mozilla-actions/sccache-action@v0.0.11
  #
  #     - name: cargo install cargo-hack
  #       uses: taiki-e/install-action@v2
  #       with:
  #         tool: cargo-hack
  #
  #     # intentionally no target specifier; see https://github.com/jonhoo/rust-ci-conf/pull/4
  #     # --feature-powerset runs for every combination of features
  #     - name: cargo hack
  #       env:
  #         SCCACHE_GHA_ENABLED: "true"
  #         RUSTC_WRAPPER: "sccache"
  #       run: cargo hack --feature-powerset check --at-least-one-of rusb,nusb
  msrv:
    # check that we can build using the minimal rust version that is specified by this crate
    runs-on: ubuntu-latest
    # we use a matrix here just because env can't be used in job names
    # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
    strategy:
      matrix:
        msrv: ["1.88"]
    name: MSRV / ${{ matrix.msrv }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.msrv }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.msrv }}

      - uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: cargo +${{ matrix.msrv }} check
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo check
  flake:
    name: flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: flake check
        run: nix flake check

  cd:
    needs:
      - fmt
      - clippy
      - check
      - semver
      - doc
      - msrv
      - flake
      - version-gate

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.version-gate.outputs.should_release == 'true'

    permissions:
      contents: write

    uses: ./.github/workflows/release.yml
    secrets: inherit
